<text x="40.0" y="824.0" font-size="14" fill="#555" font-weight="normal" text-anchor="start">Four bands. <a href="../Sparecare_OGYS_FRD-v1.0.html#s-5--m001---data-upload-and-mapping"><tspan text-decoration="underline">M001</tspan></a>, <a href="../Sparecare_OGYS_FRD-v1.0.html#s-11--m007---user-and-access-management"><tspan text-decoration="underline">M007</tspan></a> and <a href="../Sparecare_OGYS_FRD-v1.0.html#s-12--m008---dealer-and-location-management"><tspan text-decoration="underline">M008</tspan></a> hold the data and masters; <a href="../Sparecare_OGYS_FRD-v1.0.html#s-6--m002---ooq-rules"><tspan text-decoration="underline">M002</tspan></a>-<a href="../Sparecare_OGYS_FRD-v1.0.html#s-8--m004---internal-transfers--auto-approval"><tspan text-decoration="underline">M004</tspan></a> and <a href="../Sparecare_OGYS_FRD-v1.0.html#s-13--m009---ogs-and-sister-rules"><tspan text-decoration="underline">M009</tspan></a> are the rules; <a href="../Sparecare_OGYS_FRD-v1.0.html#s-9--m005---order-generation"><tspan text-decoration="underline">M005</tspan></a> and <a href="../Sparecare_OGYS_FRD-v1.0.html#s-10--m006---order-output--notifications-and-feedback"><tspan text-decoration="underline">M006</tspan></a> process the order; <a href="../Sparecare_OGYS_FRD-v1.0.html#s-14--m010---monitoring-and-dashboard"><tspan text-decoration="underline">M010</tspan></a> monitors it. <a href="../Sparecare_OGYS_FRD-v1.0.html#s-13--m009---ogs-and-sister-rules"><tspan text-decoration="underline">M009</tspan></a> comes from the reference FRD and is to be confirmed (<a href="../Sparecare_OGYS_FRD-v1.0.html#s-18--open-issues"><tspan text-decoration="underline">OI-056</tspan></a>); <a href="../Sparecare_OGYS_FRD-v1.0.html#s-14--m010---monitoring-and-dashboard"><tspan text-decoration="underline">M010</tspan></a> is the next</text>
<text x="40.0" y="844.0" font-size="14" fill="#555" font-weight="normal" text-anchor="start">stage (<a href="../Sparecare_OGYS_FRD-v1.0.html#s-18--open-issues"><tspan text-decoration="underline">OI-053</tspan></a>).</text>
